name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Most tests cover pure logic (title cleaning, dedup, author
      # normalisation, filename safety, scoring, series-number parsing), but the
      # verify_output end-to-end tests build and probe a real .m4b, so ffmpeg is
      # needed for full coverage — without it those tests silently skip.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run unit tests
        run: python -m unittest test_ab.py -v
