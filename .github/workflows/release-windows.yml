name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          pip install wxPython==4.2.2 pyinstaller==6.10.0

      - name: Download ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor/ffmpeg | Out-Null
          $url = 'https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip'
          $zip = 'ffmpeg.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath ffmpeg-extract
          $bin = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName vendor/ffmpeg/ffmpeg.exe
          $probe = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $probe.FullName vendor/ffmpeg/ffprobe.exe
          Remove-Item -Recurse -Force ffmpeg-extract, $zip

      - name: Build with PyInstaller
        run: pyinstaller audiobookConverter.spec --noconfirm

      - name: Zip dist folder
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path dist/AudiobookConverter -DestinationPath "AudiobookConverter-$tag-Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudiobookConverter-Windows
          path: AudiobookConverter-*.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AudiobookConverter-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
